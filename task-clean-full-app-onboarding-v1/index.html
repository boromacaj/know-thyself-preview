    <!-- interactive-widget MUST be stated explicitly. Its spec default is
         resizes-visual, under which Chrome PANS the visual viewport to reveal a
         focused field - which slides the whole page, Earth included, up behind
         the browser chrome. That is the physical-Samsung bug, and it is why
         every earlier fix worked in a desktop simulation and failed on device:
         shrinking a desktop window emulates resizes-content, the mode the page
         was never actually in. resizes-content shrinks the LAYOUT viewport
         instead, so the visual viewport never pans; the scene is then held
         still by its own fixed root in onboardingKeyboardViewport. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <link rel="stylesheet" href="/know-thyself-preview/task-clean-full-app-onboarding-v1/premium-earth-phase-a.css" />
    <script>
      /*
       * A CLEAN BUILD KEEPS ITS OWN STORAGE.
       *
       * Every preview of every branch is served from ONE browser origin, and localStorage belongs to the origin, not to the path: a profile saved by one preview
       * was restored by all of them, and one preview's reset wiped the others'. A page carrying the kt-clean-onboarding stamp (a build-time
       * decision, see src/cleanBuild.ts) therefore sees localStorage and sessionStorage through a view that prefixes every key with this page's own path. It
       * can read, write and clear only its own keys, and it never touches another preview's. It runs before every other script, so the startup boundary
       * below and every module see the same view. Any other page returns on the first line and is byte-for-byte what it was.
       *
       * Plain ES5: no imports, no optional chaining.
       */
      (function () {
        var stamp = document.querySelector('meta[name="kt-clean-onboarding"]');
        if (!stamp || stamp.getAttribute('content') !== '1') return;
        var scope = String(window.location.pathname).replace(/\/(?:index|premium-earth-phase-a)\.html$/, '').replace(/\/+$/, '');
        var prefix = 'kt-clean:' + (scope || '/') + ':';
        function isolate(name) {
          var real;
          try { real = window[name]; real.length; } catch (error) { return; } /* blocked storage: the page copes with that exactly as it always did */
          function own() {
            var found = [];
            for (var i = 0; i < real.length; i += 1) {
              var key = real.key(i);
              if (key !== null && key.indexOf(prefix) === 0) found.push(key.slice(prefix.length));
            }
            return found;
          }
          var view = {
            getItem: function (key) { return real.getItem(prefix + key); },
            setItem: function (key, value) { real.setItem(prefix + key, value); },
            removeItem: function (key) { real.removeItem(prefix + key); },
            key: function (index) { var all = own(); return index >= 0 && index < all.length ? all[index] : null; },
            clear: function () { var all = own(); for (var i = 0; i < all.length; i += 1) real.removeItem(prefix + all[i]); }
          };
          Object.defineProperty(view, 'length', { get: function () { return own().length; } });
          try { Object.defineProperty(window, name, { configurable: true, get: function () { return view; } }); } catch (error) { /* cannot be replaced: leave it alone */ }
        }
        isolate('localStorage');
        isolate('sessionStorage');
        window.__ktStorageScope = prefix;
        /* A person this build already knows is not shown the front door a second time: the veil and the tunnel are skipped from the first paint, and
           profileSessionRestore.ts takes them to the Main Menu. If the saved record turns out to be unusable the onboarding still runs, minus its opening. */
        try {
          if (window.localStorage.getItem('knowthyself.profile') !== null) {
            document.documentElement.setAttribute('data-kt-returning', '1');
            var skip = document.createElement('style');
            skip.textContent = 'html[data-kt-returning] #incarnation-veil, html[data-kt-returning] #spacetime-intro { display: none !important; }';
            document.head.appendChild(skip);
          }
        } catch (error) { /* storage is blocked: there is nobody to remember */ }
      })();
    </script>
    <script>
      /*
       * STARTUP BOUNDARY - the one part of the page that cannot be taken down by a module that fails to load.
       *
       * Reported from a physical Samsung: ~600 ES modules are fetched on a cold load, and a module graph is all-or-nothing. One failed
       * request at +4.4 s stopped vesselOrbit.js from ever evaluating - and with it the intro watchdog, which was only reachable through
       * that graph - and a second failure rejected the dynamic Earth import, which nothing caught. The tunnel then waited for an Earth
       * that was never coming, for ever, behind covers that swallow every tap.
       *
       * This is a classic inline script, so it has no dependency to fail. It:
       *   - notices a failed or stalled entry module (error event on the script tag, a link-time SyntaxError, a module that never ran);
       *   - tries to bring it back in place (Chromium re-fetches a failed graph; WebKit remembers the failure, so it falls through);
       *   - reloads once, first re-fetching the failed files past the HTTP cache;
       *   - and if that is spent, shows a recovery screen with a Retry button instead of an endless tunnel.
       * It also probes the failed graph, so a report can say WHICH file failed and whether it is reachable now (transient) or missing.
       *
       * The modules talk to it through window.__ktStartup (see src/startupBridge.ts). Keep this plain ES5-style code: no imports, no
       * optional chaining, and no quoted root-absolute path (the artifact rebase and version passes rewrite those).
       */
      (function () {
        'use strict';
        var timings = window.__ktStartupTimings || {};
        var STALL_MS = timings.stallMs || 25000;
        var SETTLE_MS = timings.settleMs || 45000;
        var TICK_MS = timings.tickMs || 1000;
        var PROBE_MS = timings.probeMs || 8000;
        var RELOAD_PREP_MS = timings.reloadPrepMs || 5000;
        var RETRY_DELAYS = timings.retryDelays || [700, 2500];
        var MODULE_ROOT = 'assets/frontend-app/src/';
        var EXPECTED = ['premium-earth-phase-a', 'vesselOrbit'];
        var RETRY_KEY = 'kt-startup-retried';
        var started = performance.now();
        var failures = [];
        var probes = [];
        var alive = {};
        var rawUrls = {};
        var screenMode = 'none';
        var host = null;
        var reloading = false;
        var settled = false;
        var userRetries = 0;
        var recovered = [];

        function elapsed() { return Math.round(performance.now() - started); }
        /* The one automatic reload is remembered for the tab. Where storage is blocked there is no way to remember it, so there is none: a
           reload loop is worse than the recovery screen. */
        var storageOk = false;
        var reloadedOnce = false;
        try {
          window.sessionStorage.setItem(RETRY_KEY + '-probe', '1');
          window.sessionStorage.removeItem(RETRY_KEY + '-probe');
          storageOk = true;
          reloadedOnce = window.sessionStorage.getItem(RETRY_KEY) === '1';
        } catch (error) { storageOk = false; }
        function remember(on) {
          try {
            if (on) window.sessionStorage.setItem(RETRY_KEY, '1');
            else window.sessionStorage.removeItem(RETRY_KEY);
          } catch (error) { /* checked once above */ }
        }

        /* What the report may carry: the path under the module root, never a query string, a host or a long number. */
        function rel(url) {
          var path = String(url || '').split('#')[0].split('?')[0];
          var at = path.indexOf(MODULE_ROOT);
          path = at >= 0 ? path.slice(at + MODULE_ROOT.length) : path.split('/').pop();
          return path.replace(/\d{6,}/g, '[n]').slice(0, 120);
        }
        function clip(message) {
          return String(message || '')
            .replace(/https?:\/\/[^\s)"']+/g, function (found) { return rel(found); })
            .replace(/\d{6,}/g, '[n]')
            .replace(/\s+/g, ' ')
            .slice(0, 160);
        }
        function isAppModule(url) {
          var text = String(url || '');
          return text.indexOf(MODULE_ROOT) >= 0 && text.indexOf('/qaDiag') < 0;
        }
        function entryName(url) {
          var found = /([^\/?#]+)\.js(?:[?#]|$)/.exec(String(url || ''));
          return found ? found[1] : '';
        }
        function allAlive() {
          for (var i = 0; i < EXPECTED.length; i += 1) if (alive[EXPECTED[i]] === undefined) return false;
          return true;
        }
        function introState() {
          var experience = document.getElementById('place-experience');
          return experience ? experience.getAttribute('data-intro-state') : null;
        }

        function record(kind, severity, url, message) {
          var shown = rel(url);
          for (var i = 0; i < failures.length; i += 1) {
            if (failures[i].kind === kind && failures[i].url === shown) return failures[i];
          }
          var entry = { t: elapsed(), kind: kind, severity: severity, url: shown, message: clip(message) };
          if (failures.length < 12) failures.push(entry);
          if (url) rawUrls[shown] = String(url);
          try { document.documentElement.setAttribute('data-startup-failure', kind); } catch (error) { /* a document without a root has bigger problems */ }
          return entry;
        }

        // ---- the recovery screen ------------------------------------------------------------------------------------------------
        var TEXT = {
          en: {
            reconnecting: ['Reconnecting…', 'The connection was interrupted while the app was loading.'],
            blocked: ['Loading did not finish', 'The connection was interrupted while the app was loading. Nothing you entered is lost.'],
            stalled: ['Still loading…', 'This is taking longer than usual. The connection may be weak.'],
            notice: ['The 3D Earth did not load. You can carry on.'],
            retry: 'Try again', wait: 'Keep waiting'
          },
          sk: {
            reconnecting: ['Obnovujem spojenie…', 'Spojenie sa počas načítavania prerušilo.'],
            blocked: ['Načítanie sa nedokončilo', 'Spojenie sa počas načítavania prerušilo. Nič z toho, čo si zadal, sa nestratilo.'],
            stalled: ['Načítavam…', 'Trvá to dlhšie ako zvyčajne. Spojenie môže byť slabé.'],
            notice: ['Trojrozmerná Zem sa nenačítala. Môžeš pokračovať.'],
            retry: 'Skúsiť znova', wait: 'Ešte počkať'
          }
        };
        function words() {
          var language = 'en';
          try {
            var stored = window.localStorage.getItem('kt-locale');
            if (stored === 'sk' || stored === 'en') language = stored;
            else if (String(navigator.language || '').toLowerCase().indexOf('sk') === 0) language = 'sk';
          } catch (error) { /* storage can be blocked */ }
          return TEXT[language];
        }
        function make(tag, css, text) {
          var node = document.createElement(tag);
          if (css) node.style.cssText = css;
          if (text) node.textContent = text;
          return node;
        }
        function button(label, primary, onTap) {
          var node = make('button', 'font:600 16px/1 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;min-height:48px;padding:0 26px;border-radius:24px;'
            + 'cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;margin:6px;color:#f3ecdd;'
            + (primary ? 'background:rgba(214,190,140,.22);border:1px solid rgba(214,190,140,.75);' : 'background:transparent;border:1px solid rgba(243,236,221,.35);'), label);
          node.type = 'button';
          node.addEventListener('click', onTap);
          return node;
        }
        function hideScreen() {
          if (host && host.parentNode) host.parentNode.removeChild(host);
          host = null;
          screenMode = 'none';
          try { document.documentElement.removeAttribute('data-startup-screen'); } catch (error) { /* nothing to remove */ }
        }
        function showScreen(mode) {
          if (screenMode === mode && host) return;
          if (host && host.parentNode) host.parentNode.removeChild(host);
          var copy = words();
          var wrapper;
          if (mode === 'notice') {
            wrapper = make('div', 'position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:2147479000;display:flex;justify-content:center;'
              + 'padding:0 12px;pointer-events:none;');
            var pill = make('div', 'pointer-events:auto;display:flex;align-items:center;gap:8px;max-width:420px;padding:6px 8px 6px 16px;border-radius:26px;'
              + 'background:rgba(5,7,6,.88);border:1px solid rgba(214,190,140,.45);color:#f3ecdd;font:400 14px/1.35 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;');
            pill.appendChild(make('span', '', copy.notice[0]));
            pill.appendChild(button(copy.retry, false, manualRetry));
            wrapper.appendChild(pill);
          } else {
            wrapper = make('div', 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147479000;display:flex;align-items:center;justify-content:center;'
              + 'padding:24px;box-sizing:border-box;background:rgba(5,7,6,.94);color:#f3ecdd;text-align:center;'
              + 'font:400 16px/1.5 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;');
            var card = make('div', 'max-width:340px;');
            card.appendChild(make('h1', 'font:600 22px/1.25 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;margin:0 0 12px;', copy[mode][0]));
            card.appendChild(make('p', 'margin:0 0 22px;opacity:.82;', copy[mode][1]));
            if (mode === 'blocked' || mode === 'stalled') {
              card.appendChild(button(copy.retry, true, manualRetry));
              if (mode === 'stalled') card.appendChild(button(copy.wait, false, hideScreen));
            }
            wrapper.appendChild(card);
          }
          wrapper.setAttribute('role', mode === 'blocked' ? 'alertdialog' : 'status');
          wrapper.setAttribute('aria-live', 'polite');
          wrapper.setAttribute('data-startup-recovery', mode);
          (document.body || document.documentElement).appendChild(wrapper);
          host = wrapper;
          screenMode = mode;
          try { document.documentElement.setAttribute('data-startup-screen', mode); } catch (error) { /* attribute only mirrors the state */ }
        }

        // ---- diagnosis: which file, and is it reachable now -----------------------------------------------------------------------
        var STATIC_IMPORT = /\b(?:import|export)\b[^'"();]*?(?:\bfrom\s*)?['"](\.{1,2}\/[^'"]+)['"]/g;
        function probe(entryUrl) {
          if (!entryUrl || !window.fetch) return;
          var key = rel(entryUrl);
          for (var i = 0; i < probes.length; i += 1) if (probes[i].entry === key) return;
          var result = { entry: key, checked: 0, failed: [], verdict: 'running', ms: 0 };
          probes.push(result);
          var begun = performance.now();
          var queue = [String(entryUrl)];
          var seen = {};
          var active = 0;
          var finished = false;
          function finish(verdict) {
            if (finished) return;
            finished = true;
            result.verdict = verdict;
            result.ms = Math.round(performance.now() - begun);
          }
          function pump() {
            if (finished) return;
            if (performance.now() - begun > PROBE_MS) { finish(result.failed.length ? 'failure-reproduced' : 'inconclusive-deadline'); return; }
            if (result.failed.length >= 3) { finish('failure-reproduced'); return; }
            while (active < 6 && queue.length && result.checked + active < 1500) {
              var next = queue.shift();
              var id = next.split('#')[0];
              if (seen[id]) continue;
              seen[id] = true;
              active += 1;
              check(next);
            }
            if (!active && !queue.length) finish(result.failed.length ? 'failure-reproduced' : 'all-reachable-now');
          }
          function check(url) {
            var bad = function (status, type) {
              result.failed.push({ url: rel(url), status: status, type: String(type || '').slice(0, 40) });
              rawUrls[rel(url)] = url;
              /* The first unreachable file is the answer; requests already in flight may still add to the list. */
              finish('failure-reproduced');
            };
            window.fetch(url).then(function (response) {
              var type = response.headers.get('content-type') || '';
              if (!response.ok) { bad(response.status, type); return ''; }
              if (!/javascript|ecmascript/i.test(type)) { bad(response.status, type); return ''; }
              return response.text();
            }).then(function (source) {
              var found;
              STATIC_IMPORT.lastIndex = 0;
              while ((found = STATIC_IMPORT.exec(source)) !== null) {
                try { queue.push(new URL(found[1], url).href); } catch (error) { /* an unparsable specifier is not a fetchable file */ }
              }
            }).catch(function () {
              bad(0, 'network-error');
            }).then(function () {
              active -= 1;
              result.checked += 1;
              pump();
            });
          }
          pump();
          window.setTimeout(function () { finish(result.failed.length ? 'failure-reproduced' : 'inconclusive-deadline'); }, PROBE_MS + 500);
        }

        // ---- recovery -----------------------------------------------------------------------------------------------------------------
        function refreshFailed() {
          return new Promise(function (resolve) {
            if (!window.fetch) { resolve(); return; }
            var urls = [];
            var seen = {};
            for (var shown in rawUrls) {
              if (Object.prototype.hasOwnProperty.call(rawUrls, shown) && !seen[rawUrls[shown]]) { seen[rawUrls[shown]] = true; urls.push(rawUrls[shown]); }
            }
            var pending = urls.length;
            if (!pending) { resolve(); return; }
            var done = function () { pending -= 1; if (pending <= 0) resolve(); };
            for (var i = 0; i < urls.length; i += 1) {
              window.fetch(urls[i], { cache: 'reload' }).then(done, done);
            }
            window.setTimeout(resolve, RELOAD_PREP_MS);
          });
        }
        function reloadNow(automatic) {
          if (reloading) return;
          reloading = true;
          if (automatic) remember(true);
          showScreen('reconnecting');
          refreshFailed().then(function () { window.location.reload(); });
        }
        function manualRetry() {
          userRetries += 1;
          reloadNow(false);
        }
        /* In-place attempts are spent (or never applied): reload once on our own, then hand the choice to the person. */
        function exhausted(severity, reloadHelps) {
          if (settled || reloading) return false;
          if (reloadHelps !== false && storageOk && !reloadedOnce) {
            reloadNow(true);
            return true;
          }
          showScreen(severity === 'blocking' ? 'blocked' : 'notice');
          return false;
        }
        function importAgain(url) {
          if (typeof window.__ktImport !== 'function') return Promise.reject(new Error('no dynamic import'));
          return window.__ktImport(url);
        }
        function recoverEntry(url, attempt, severity) {
          if (attempt >= RETRY_DELAYS.length) { exhausted(severity, true); return; }
          window.setTimeout(function () {
            if (reloading) return;
            importAgain(url).then(function () {
              recovered.push(rel(url));
              if (screenMode === 'blocked') hideScreen();
            }, function () { recoverEntry(url, attempt + 1, severity); });
          }, RETRY_DELAYS[attempt]);
        }
        function entryFailed(url, kind) {
          var severity = EXPECTED.indexOf(entryName(url)) >= 0 ? 'blocking' : 'degraded';
          record(kind, severity, url, '');
          probe(url);
          recoverEntry(url, 0, severity);
        }

        window.addEventListener('error', function (event) {
          var target = event.target;
          if (target && target !== window && target.tagName === 'SCRIPT' && target.type === 'module' && isAppModule(target.src)) {
            entryFailed(target.src, 'entry-module-load');
            return;
          }
          if (target && target !== window && target.tagName === 'LINK' && /stylesheet/i.test(target.rel || '')) {
            record('stylesheet-load', 'degraded', target.href, '');
            return;
          }
          var error = event.error;
          if (error && error.name === 'SyntaxError' && isAppModule(event.filename)
              && /does not provide an export|binding name|import not found|requested module/i.test(String(error.message))) {
            record('module-link-error', 'blocking', event.filename, error.message);
            probe(event.filename);
            exhausted('blocking', true);
          }
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var text = reason && reason.message ? String(reason.message) : String(reason || '');
          if (/dynamically imported module|Importing a module script failed/i.test(text)) {
            var found = /https?:\/\/[^\s)"']+/.exec(text);
            record('dynamic-import-unhandled', 'degraded', found ? found[0] : '', text);
          }
        });

        // ---- the surface the modules use --------------------------------------------------------------------------------------------
        var api = window.__ktStartup = {
          version: 1,
          alive: function (name) {
            alive[name] = elapsed();
            if (allAlive() && screenMode === 'stalled') hideScreen();
          },
          /* A module reports a failure it could not recover from. Returns true when the page is about to reload (do not degrade). */
          fail: function (report) {
            record(String(report.kind || 'module'), report.severity === 'blocking' ? 'blocking' : 'degraded', report.url || '', report.message || '');
            if (report.url) probe(report.url);
            return exhausted(report.severity === 'blocking' ? 'blocking' : 'degraded', report.reloadHelps);
          },
          snapshot: function () {
            return {
              upMs: elapsed(), expected: EXPECTED, alive: alive, failures: failures, probes: probes, screen: screenMode,
              reloadedOnce: reloadedOnce, storageOk: storageOk, recoveredInPlace: recovered, userRetries: userRetries, settled: settled, introState: introState()
            };
          }
        };
        Object.defineProperty(api, 'blocking', { get: function () { return screenMode === 'blocked' || screenMode === 'reconnecting'; } });

        // ---- the outer bound: what the entry modules were expected to do, and by when -------------------------------------------------------
        var tick = window.setInterval(function () {
          if (reloading) return;
          var up = performance.now() - started;
          var complete = introState() === 'complete';
          if (allAlive() && complete) {
            settled = true;
            window.clearInterval(tick);
            remember(false);
            if (screenMode !== 'notice') hideScreen();
            return;
          }
          if (!allAlive() && up > STALL_MS && screenMode === 'none' && !failures.length) {
            var missing = [];
            for (var i = 0; i < EXPECTED.length; i += 1) if (alive[EXPECTED[i]] === undefined) missing.push(EXPECTED[i]);
            record('entry-stalled', 'blocking', missing.join('+'), 'entry modules did not finish evaluating');
            showScreen('stalled');
          }
          if (up > SETTLE_MS && !complete && screenMode !== 'blocked') {
            record('intro-stalled', 'blocking', '', 'intro state ' + introState());
            exhausted('blocking', true);
          }
        }, TICK_MS);
        window.addEventListener('pagehide', function () { window.clearInterval(tick); }, { once: true });
      })();
    </script>
    <script>
      /* Its own block so a browser that cannot parse a dynamic import loses only the in-place retry, never the boundary above. */
      window.__ktImport = function (url) { return import(url); };
    </script>
    <style>
      /* Stronger seamless crossfade from the preserved rotating-Earth template:
         the warp lingers visibly while the live Earth becomes readable much sooner. */
      .spacetime-intro {
        transition: opacity 2200ms cubic-bezier(0.33, 0, 0.67, 1) !important;
      }

      /*
       * THE INCARNATION VEIL.
       * ---------------------
       * A beat BEFORE the warp: pure black, one line, and then the black
       * dissolves into the tunnel rather than cutting to it.
       *
       * WHY A SEPARATE LAYER ABOVE THE WARP
       * The warp overlay is already opaque black with the video inside it, so
       * the phrase could have ridden it - and used to. It does not now, because
       * the words are meant to be read on nothing at all. Over a moving tunnel
       * they compete with it; the pause is the effect.
       *
       * THE WARP ARRIVES UNDER THE TAIL OF THE WORDS
       * The phrase starts leaving at in + hold and takes its time about it. The
       * black begins lifting later, timed so that it finishes on the same frame
       * the words do - the tunnel comes up under the last part of the dissolve,
       * and neither is left finishing on its own. The video is armed a hair
       * before that so its first frames are already running underneath rather
       * than starting from a still.
       *
       * A version in between kept them apart, with a beat of empty black after
       * the words and before the tunnel. It was cleaner to describe and worse to
       * watch: the pause read as the page having stalled.
       *
       * THE TIMELINE LIVES HERE AND NOWHERE ELSE
       * --kt-veil-reveal-at is READ by the inline intro script to decide when to
       * press play. One number in one place: a second copy in JS would drift,
       * and the drift would show up as a stutter at the handoff. The durations
       * drive the animations directly rather than through keyframe percentages,
       * so changing one value cannot silently desynchronise the rest.
       */
      .incarnation-veil {
        /* Two seconds arriving, a second held, three seconds leaving. The
           fade-out is the longest span in the beat on purpose: it is the part
           that was reading as the words being cut off. */
        --kt-phrase-in: 2000ms;
        --kt-phrase-hold: 1000ms;
        --kt-phrase-out: 3000ms;
        /*
         * THE WARP ARRIVES INSIDE THE LAST PART OF THE FADE, NOT ACROSS ALL OF IT.
         *
         * The words begin leaving at in + hold = 3000ms and are gone at 6000ms.
         * The black starts lifting at 4500ms and takes 1500ms, so it finishes on
         * the same frame the words do: the tunnel comes up under the tail of the
         * dissolve rather than under the whole of it, and neither one is left
         * finishing alone.
         *
         * These two are therefore NOT the same number any more, and the phrase
         * is no longer pinned to this one - it has its own start at in + hold.
         * The relationship that has to hold is
         *   reveal-at + veil-out == in + hold + out
         * which is what the test asserts rather than the individual figures.
         */
        --kt-veil-reveal-at: 4500ms;
        --kt-veil-out: 1500ms;

        position: absolute;
        inset: 0;
        /* Above .spacetime-intro, which is 9. */
        z-index: 10;
        display: grid;
        place-items: center;
        background: #000;
        pointer-events: none;
        opacity: 1;
        animation: kt-veil-lift var(--kt-veil-out) cubic-bezier(0.4, 0, 0.2, 1)
          var(--kt-veil-reveal-at) forwards;
      }

      .incarnation-phrase {
        margin: 0;
        width: min(84vw, 460px);
        text-align: center;
        font-family: var(--font-display, "Cormorant Garamond", Georgia, serif);
        font-size: clamp(21px, 5.6vw, 34px);
        font-weight: 300;
        font-style: italic;
        letter-spacing: .012em;
        color: rgba(244, 242, 252, .94);
        text-shadow: 0 0 18px rgba(120, 108, 220, .5), 0 0 46px rgba(0, 0, 0, .55);
        opacity: 0;
        /* Two animations, not one keyframe track: the fade-in owns the opening
           and the fade-out owns the dissolve, each on its own clock. The
           dissolve starts at in + hold and runs the full --kt-phrase-out; the
           black lifts later, inside its tail. The easing eases OUT at the end
           (the 0.24, 1 control point), so the last of the opacity is the
           slowest part rather than a step to zero. */
        animation:
          kt-phrase-rise var(--kt-phrase-in) cubic-bezier(0.32, 0, 0.24, 1) forwards,
          kt-phrase-dissolve var(--kt-phrase-out) cubic-bezier(0.32, 0, 0.24, 1)
            calc(var(--kt-phrase-in) + var(--kt-phrase-hold)) forwards;
      }

      @keyframes kt-veil-lift {
        to { opacity: 0; visibility: hidden; }
      }

      @keyframes kt-phrase-rise {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /*
       * BOTH ENDS ARE WRITTEN OUT.
       *
       * `to { opacity: 0 }` alone leaves the from-keyframe implicit, and an
       * implicit keyframe takes the property's UNDERLYING value - which here is
       * the `opacity: 0` declared on .incarnation-phrase, not the 1 that the
       * fade-in is holding through its forwards fill. Engines disagree about
       * whether an earlier animation in the same stack counts as underlying, so
       * the dissolve could run 0 -> 0 and the words would blink out instead of
       * fading. Writing `from` removes the question.
       */
      @keyframes kt-phrase-dissolve {
        from { opacity: 1; transform: translateY(0); }
        to   { opacity: 0; transform: translateY(-8px); }
      }

      /*
       * The drift goes; the crossfade stays. It is the transition itself rather
       * than decoration, and a hard cut into the warp is the one thing this beat
       * exists to remove.
       *
       * The durations are restated with !important because the sitewide
       * reduced-motion rule in premium-earth-phase-a.css collapses EVERY
       * animation to 0.01ms. Without this the phrase flashes for one frame and
       * the black cuts - measured, not assumed. That file already carves out
       * .spacetime-intro and .earth-map for the same reason; this joins them.
       */
      @media (prefers-reduced-motion: reduce) {
        .incarnation-veil {
          animation-name: kt-veil-lift !important;
          animation-duration: var(--kt-veil-out) !important;
          animation-delay: var(--kt-veil-reveal-at) !important;
          animation-fill-mode: forwards !important;
          animation-timing-function: linear !important;
        }
        .incarnation-phrase {
          animation-name: kt-phrase-rise-still, kt-phrase-dissolve-still !important;
          animation-duration: var(--kt-phrase-in), var(--kt-phrase-out) !important;
          animation-delay: 0ms, calc(var(--kt-phrase-in) + var(--kt-phrase-hold)) !important;
          animation-fill-mode: forwards, forwards !important;
          animation-timing-function: linear, linear !important;
        }
        @keyframes kt-phrase-rise-still { from { opacity: 0; } to { opacity: 1; } }
        @keyframes kt-phrase-dissolve-still { from { opacity: 1; } to { opacity: 0; } }
      }

      .earth-map {
        transition: opacity 1500ms cubic-bezier(0.33, 0, 0.67, 1) !important;
      }

      /* VESSEL orbit — three equal choices, always separated by exactly 120 degrees.
         Position is driven by vesselOrbit.ts so the whole triangle can rotate and be dragged. */
      .vessel-orbit {
        position: relative;
        display: block;
        width: min(76vw, 440px);
        aspect-ratio: 1;
        margin-top: clamp(24px, 4.5vh, 42px);
        touch-action: none;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: contain;
      }

      .vessel-orbit::before {
        position: absolute;
        inset: 18.5%;
        border: 1px solid rgba(216, 195, 142, 0.085);
        border-radius: 50%;
        content: "";
        pointer-events: none;
        box-shadow:
          0 0 52px rgba(216, 195, 142, 0.025),
          0 0 0 1px rgba(244, 241, 233, 0.012) inset;
      }

      .vessel-orbit::after {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        content: "";
        pointer-events: none;
        opacity: 0.46;
        transform: translate(-50%, -50%);
        background: rgba(216, 195, 142, 0.5);
        box-shadow: 0 0 24px rgba(216, 195, 142, 0.24);
      }

      .vessel-orbit.is-dragging { cursor: grabbing; }

      .vessel-choice {
        position: absolute;
        top: 50%;
        left: 50%;
        width: clamp(92px, 13vw, 138px);
        gap: 12px;
        transform:
          translate(-50%, -50%)
          translate3d(var(--vessel-x, 0px), var(--vessel-y, 0px), 0);
        transition: transform 90ms linear, opacity 250ms ease;
        will-change: transform;
      }

      .vessel-orbit.is-dragging .vessel-choice { transition: opacity 250ms ease; }

      .vessel-choice .vessel-symbol {
        width: 100%;
        animation: none !important;
      }

      .vessel-choice-female .vessel-symbol,
      .vessel-choice-nonbinary .vessel-symbol {
        animation: none !important;
      }

      .vessel-actions { margin-top: clamp(18px, 3vh, 30px); }

      @media (max-width: 680px) {
        .vessel-orbit {
          width: min(82vw, 340px);
          margin-top: 22px;
        }

        .vessel-choice { width: clamp(80px, 25vw, 104px); }
        .vessel-actions { margin-top: 18px; }
      }

      @media (max-height: 690px) {
        .vessel-orbit {
          width: min(66vw, 270px);
          margin-top: 16px;
        }

        .vessel-choice { width: clamp(68px, 18vh, 88px); }
        .vessel-actions { margin-top: 14px; }
      }

      /* Focused VESSEL = the live Earth itself.
         At the canonical 56,000 km / 35° world pose the globe occupies ~32.6%
         of the map viewport height. Binding the focused selector to that same
         projected diameter makes its coloured rim read as the Earth's atmosphere
         instead of a separate floating bubble. */
      .vessel-orbit.is-focused .vessel-choice.is-focused {
        width: min(86vw, 32.6dvh, 520px) !important;
        transform: translate(-50%, -50%) translate3d(0, 0, 0) scale(1) !important;
        filter: brightness(1.04) blur(0) !important;
      }

      .vessel-orbit.is-focused .vessel-choice.is-focused .vessel-symbol {
        border-color: rgba(var(--vessel-energy-rgb), 0.74) !important;
        background:
          radial-gradient(circle at 29% 22%, rgba(255, 255, 255, 0.11), transparent 12%),
          radial-gradient(circle at 72% 72%, rgba(var(--vessel-energy-soft-rgb), 0.025), transparent 32%),
          radial-gradient(circle at 50% 48%, rgba(var(--vessel-energy-rgb), 0.012), rgba(3, 6, 7, 0.018) 68%, rgba(3, 6, 7, 0.035) 100%) !important;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.045) inset,
          0 0 18px rgba(var(--vessel-energy-rgb), 0.3),
          0 0 44px rgba(var(--vessel-energy-rgb), 0.2),
          0 0 86px rgba(var(--vessel-energy-rgb), 0.11) !important;
        backdrop-filter: blur(1.5px) saturate(1.01) !important;
        -webkit-backdrop-filter: blur(1.5px) saturate(1.01) !important;
      }

      .vessel-orbit.is-focused .vessel-choice.is-focused .vessel-symbol::before {
        inset: 1.5% !important;
        border-color: rgba(var(--vessel-energy-soft-rgb), 0.16) !important;
        opacity: 0.82 !important;
        -webkit-mask: radial-gradient(circle, transparent 0 91%, #000 93% 100%) !important;
        mask: radial-gradient(circle, transparent 0 91%, #000 93% 100%) !important;
      }

      .vessel-orbit.is-focused .vessel-choice.is-focused .vessel-symbol::after {
        opacity: 0.18 !important;
      }

      .vessel-orbit.is-focused .vessel-choice.is-focused .vessel-label {
        margin-top: 2px;
      }

      @media (max-height: 690px) {
        .vessel-orbit.is-focused .vessel-choice.is-focused {
          width: min(82vw, 32.6dvh, 420px) !important;
        }
      }
    </style>
  </head>
  <body>
    <main
      class="place-experience"
      id="place-experience"
      data-intro-state="preloading"
      data-state="search"
    >
      <div
        class="earth-map"
        id="earth-map"
        aria-label="The Earth, slowly turning behind the page. Search for your birthplace below."
      ></div>

      <div class="atmosphere" aria-hidden="true"></div>
      <div class="earth-loading-cover" id="earth-loading-cover" aria-hidden="true"></div>

      <!-- Sits ABOVE the warp overlay so the warp can fade up underneath it. -->
      <div class="incarnation-veil" id="incarnation-veil" aria-hidden="true">
        <p
          class="incarnation-phrase"
          id="incarnation-phrase"
          data-kt-en="Your soul is entering matter"
          data-kt-sk="Tvoja duša vstupuje do hmoty"
        >Your soul is entering matter</p>
      </div>
      <script>
        /*
         * THE FIRST PAINTED FRAME MUST ALREADY BE IN THE RIGHT LANGUAGE.
         *
         * The i18n pass that fills #incarnation-phrase lives in a module, and
         * modules are deferred - they run after the document is parsed. The
         * phrase meanwhile starts fading in at t=0. So a Slovak reader watched
         * the English line fade up and then swap under them.
         *
         * This runs synchronously, in the body, immediately after the element,
         * so the text is correct before anything is painted. Inline and tiny on
         * purpose: a deferred script cannot win this race by definition.
         *
         * The two strings are duplicated here from uiStrings.ts, which is a real
         * cost - so a test asserts they still match, and that is what keeps them
         * honest. The i18n pass still runs later and sets the same value.
         */
        (function () {
          var el = document.getElementById('incarnation-phrase');
          if (!el) return;
          var locale = null;
          /* Private mode and blocked storage both throw rather than return null. */
          try { locale = window.localStorage.getItem('kt-locale'); } catch (error) { locale = null; }
          var text = locale === 'sk' ? el.getAttribute('data-kt-sk') : el.getAttribute('data-kt-en');
          if (text) el.textContent = text;
        })();
      </script>

      <div class="spacetime-intro" id="spacetime-intro" aria-hidden="true">
        <video
          id="spacetime-video"
          muted
          playsinline
          preload="auto"
          tabindex="-1"
          disablepictureinpicture
          disableremoteplayback
        >
          <source src="/know-thyself-preview/task-clean-full-app-onboarding-v1/assets/onboarding/opening-warp-16x9.mp4" type="video/mp4" />
        </video>
      </div>

      <section class="interaction-dock" id="interaction-dock" aria-label="Choose and confirm your birthplace" inert>
        <div class="place-results-shell" id="place-results-shell" hidden>
          <ul class="place-results" id="place-results" role="listbox" aria-label="Birthplace suggestions"></ul>
        </div>

        <!-- This poetic question is part of the PLACE card, so it fades and retires with the search field. -->
        <p class="place-story-prompt" id="place-story-prompt">Where will your story begin?</p>

        <form class="place-search" id="place-search" role="search" novalidate>
          <label class="sr-only" for="place-query">Search for your birthplace</label>
          <span class="search-icon" aria-hidden="true"></span>
          <input
            id="place-query"
            name="place"
            type="search"
            placeholder="Enter your birthplace"
            autocomplete="off"
            aria-autocomplete="list"
            aria-controls="place-results"
            aria-expanded="false"
          />
          <button class="search-submit" type="submit" aria-label="Search">
            <span aria-hidden="true">→</span>
          </button>
        </form>

        <article class="birthplace-card" id="birthplace-card" hidden>
          <div class="birthplace-copy">
            <p>Birthplace</p>
            <h2 id="birthplace-name"></h2>
            <p class="birthplace-meta" id="birthplace-meta"></p>
          </div>
          <div class="birthplace-actions">
            <button class="change-place" id="change-place" type="button">Change</button>
            <button class="confirm-place" id="confirm-place" type="button" disabled>Confirm</button>
          </div>
        </article>
      </section>

      <section
        class="vessel-stage"
        id="vessel-stage"
        aria-labelledby="vessel-title"
        aria-hidden="true"
        inert
      >
        <div class="vessel-cosmos" aria-hidden="true"></div>

        <div class="vessel-content">
          <header class="vessel-copy">
            <p class="vessel-kicker">02 · Vessel</p>
            <h1 id="vessel-title">Choose your body</h1>
            <p class="vessel-question">What body are you entering?</p>
          </header>

          <p class="sr-only" id="vessel-orbit-instructions">
            Drag around the orbit to rotate the vessel choices. Tap a vessel to select it.
          </p>

          <div
            class="vessel-orbit"
            id="vessel-orbit"
            role="group"
            aria-label="Choose your birth vessel"
            aria-describedby="vessel-orbit-instructions"
          >
            <button class="vessel-choice vessel-choice-male" type="button" data-vessel="male" aria-pressed="false">
              <span class="vessel-symbol" aria-hidden="true">♂</span>
              <span class="vessel-label">Male</span>
            </button>

            <button class="vessel-choice vessel-choice-female" type="button" data-vessel="female" aria-pressed="false">
              <span class="vessel-symbol" aria-hidden="true">♀</span>
              <span class="vessel-label">Female</span>
            </button>

            <button class="vessel-choice vessel-choice-nonbinary" type="button" data-vessel="nonbinary" aria-pressed="false">
              <span class="vessel-symbol vessel-symbol-neutral" aria-hidden="true">⚲</span>
              <span class="vessel-label">Nonbinary</span>
            </button>
          </div>

          <div class="vessel-actions">
            <button class="vessel-undefined" id="vessel-undefined" type="button" aria-pressed="false">
              I’d rather not define it
            </button>
            <button class="confirm-vessel" id="confirm-vessel" type="button" disabled>
              Accept Body
            </button>
          </div>
        </div>
      </section>

      <p class="sr-only" id="experience-status" aria-live="polite"></p>
    </main>

    <!-- The pillar experience imports the calculation engine, which reaches
         astronomy-engine by bare specifier. The main app resolves that through
         an import map to the copy the build places in /vendor; this page needs
         the same mapping now that it runs the engine too. -->
    <script type="importmap">
      { "imports": { "astronomy-engine": "/know-thyself-preview/task-clean-full-app-onboarding-v1/vendor/astronomy-engine.js?v=f9ab0a6" } }
    </script>
    <script src="/know-thyself-preview/task-clean-full-app-onboarding-v1/runtime-config.js?v=f9ab0a6"></script>
    <script>
      (() => {
        const experience = document.getElementById('place-experience');
        const mapContainer = document.getElementById('earth-map');
        const overlay = document.getElementById('spacetime-intro');
        const video = document.getElementById('spacetime-video');
        if (
          !(experience instanceof HTMLElement)
          || !(mapContainer instanceof HTMLElement)
          || !(overlay instanceof HTMLElement)
          || !(video instanceof HTMLVideoElement)
        ) return;

        const maxIntroRangeMeters = 900_000_000;
        const warpHandoffSeconds = 3.4;
        const readinessTimeoutMillis = 6_000;
        let liveMap = null;
        let rangeGuardAttached = false;
        let earthZoomStarted = experience.dataset.introState === 'earth-zooming';
        let warpReachedHandoff = false;
        let released = false;
        let readinessTimer = 0;
        let resolveWarpReady = null;

        window.__knowThyselfWarpReadyPromise = new Promise((resolve) => {
          resolveWarpReady = resolve;
        });

        const guardLiveRange = () => {
          if (!liveMap || experience.dataset.introState === 'complete') return;
          const range = Number(liveMap.range);
          if (Number.isFinite(range) && range > maxIntroRangeMeters) {
            liveMap.range = maxIntroRangeMeters;
          }
        };

        const attachLiveRangeGuard = () => {
          const candidate = mapContainer.querySelector('gmp-map-3d');
          if (!(candidate instanceof HTMLElement) || rangeGuardAttached) return;
          liveMap = candidate;
          rangeGuardAttached = true;
          candidate.addEventListener('gmp-rangechange', guardLiveRange);
          guardLiveRange();
          experience.dataset.introMaxRangeKm = '900000';
          experience.dataset.introMedium = 'opening-warp-16x9-plus-rotating-live-google-3d';
        };

        const cleanup = () => {
          window.clearTimeout(readinessTimer);
          mapChildObserver.disconnect();
          experienceObserver.disconnect();
          if (liveMap && rangeGuardAttached) {
            liveMap.removeEventListener('gmp-rangechange', guardLiveRange);
          }
          video.pause();
        };

        const releaseDurationMillis = 2_200;

        /* The tunnel is over: let go of its decoder. Removing the overlay already pauses a playing element, but the file stays
           open and decoded until the element is collected - on a phone that is memory the Earth behind it can use. */
        const releaseVideo = () => {
          try {
            video.pause();
            for (const source of video.querySelectorAll('source')) source.remove();
            video.removeAttribute('src');
            video.load();
          } catch { /* a video that cannot be released is already not playing */ }
        };

        const releaseWarp = () => {
          if (released || !earthZoomStarted || !warpReachedHandoff) return;
          released = true;
          experience.dataset.warpIntro = 'crossfading-to-rotating-live-earth';
          overlay.classList.add('is-releasing');
          window.setTimeout(() => {
            overlay.remove();
            releaseVideo();
            experience.dataset.warpIntro = 'complete';
          }, releaseDurationMillis + 80);
        };

        const reachWarpHandoff = () => {
          if (warpReachedHandoff) return;
          warpReachedHandoff = true;
          experience.dataset.warpIntro = earthZoomStarted ? 'handoff-ready' : 'tunnel-complete-waiting-for-earth';
          resolveWarpReady?.();
          resolveWarpReady = null;
          releaseWarp();
        };

        video.muted = true;
        video.defaultMuted = true;
        video.playsInline = true;
        video.controls = false;
        video.loop = false;

        const startVideo = () => {
          experience.dataset.warpIntro = 'playing-color-warp';
          const playback = video.play();
          if (playback) {
            void playback.catch(() => {
              experience.dataset.warpIntro = 'playback-failed';
              reachWarpHandoff();
            });
          }
        };

        video.addEventListener('timeupdate', () => {
          if (video.currentTime >= warpHandoffSeconds) reachWarpHandoff();
        });
        video.addEventListener('ended', reachWarpHandoff);
        video.addEventListener('error', () => {
          experience.dataset.warpIntro = 'media-error';
          reachWarpHandoff();
        });

        const mapChildObserver = new MutationObserver(attachLiveRangeGuard);
        mapChildObserver.observe(mapContainer, { childList: true, subtree: true });
        attachLiveRangeGuard();

        const experienceObserver = new MutationObserver(() => {
          guardLiveRange();
          const state = experience.dataset.introState;
          if (state === 'earth-zooming') {
            earthZoomStarted = true;
            experience.classList.add('earth-materializing');
            releaseWarp();
          }
          if (state === 'search-revealing' || state === 'complete') {
            experience.classList.remove('earth-materializing');
          }
          if (state !== 'complete') return;
          if (liveMap && rangeGuardAttached) {
            liveMap.removeEventListener('gmp-rangechange', guardLiveRange);
            rangeGuardAttached = false;
          }
        });
        experienceObserver.observe(experience, { attributes: true, attributeFilter: ['data-intro-state'] });

        /*
         * THE WARP WAITS FOR THE VEIL.
         *
         * The tunnel hands off 3.4s after it starts playing. If it began at
         * load it would be almost over by the time the veil lifted, and the
         * reader would meet the end of an animation they never saw the start
         * of. So play is deferred until just before the black begins to
         * dissolve - a small head start, so the first frames are already
         * running as it clears rather than starting from a still.
         *
         * The delay is READ FROM THE VEIL'S OWN CSS rather than repeated here.
         * Two copies of this number would drift the moment someone retimed the
         * text, and the drift would look like a stutter at the handoff.
         *
         * If the veil is missing for any reason, this falls back to starting
         * immediately - the old behaviour - rather than never playing at all.
         */
        const veil = document.getElementById('incarnation-veil');
        const headStartMillis = 120;
        const veilDelayMillis = (() => {
          if (!veil) return 0;
          const raw = getComputedStyle(veil).getPropertyValue('--kt-veil-reveal-at').trim();
          const parsed = raw.endsWith('ms') ? Number.parseFloat(raw)
            : raw.endsWith('s') ? Number.parseFloat(raw) * 1000
            : Number.NaN;
          if (!Number.isFinite(parsed) || parsed < 0) return 0;
          return Math.max(0, parsed - headStartMillis);
        })();

        const armVideo = () => {
          if (video.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) startVideo();
          else video.addEventListener('canplay', startVideo, { once: true });
        };

        /* The readiness net starts with the video, not with the page: measuring
           it from load would spend the veil's seconds and fire early. */
        const armReadinessNet = () => {
          readinessTimer = window.setTimeout(() => {
            if (!warpReachedHandoff) reachWarpHandoff();
          }, readinessTimeoutMillis);
        };

        if (veilDelayMillis > 0) {
          window.setTimeout(() => { armVideo(); armReadinessNet(); }, veilDelayMillis);
        } else {
          armVideo();
          armReadinessNet();
        }

        /* A phone that is put down mid-tunnel can leave the video paused when it is picked up again. The readiness net hands the
           intro off either way; this only lets the tunnel carry on from where it stopped, so the reader is not left watching one
           frozen frame until the net fires. */
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState !== 'visible' || warpReachedHandoff || released) return;
          if (video.paused && !video.ended && video.currentTime > 0) void video.play().catch(() => {});
        });

        window.addEventListener('pagehide', cleanup, { once: true });
      })();
    </script>
    <!-- The outer watchdog is also an entry of its own. vesselOrbit.js imports it too (one module instance either way), but a graph
         that fails to load never runs its imports, and the watchdog is exactly what must survive that. Its own graph is two files. -->
    <script type="module" src="/know-thyself-preview/task-clean-full-app-onboarding-v1/assets/frontend-app/src/onboardingIntroWatchdog.js?v=f9ab0a6"></script>
    <script type="module" src="/know-thyself-preview/task-clean-full-app-onboarding-v1/assets/frontend-app/src/premium-earth-phase-a.js?v=f9ab0a6"></script>
    <script type="module" src="/know-thyself-preview/task-clean-full-app-onboarding-v1/assets/frontend-app/src/vesselOrbit.js?v=f9ab0a6"></script>
  </body>
